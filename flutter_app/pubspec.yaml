name: sports_talent_ai
description: AI-powered mobile sports talent assessment platform
version: 1.0.0+1
publish_to: 'none'

environment:
  sdk: '>=3.0.0 <4.0.0'
  flutter: ">=3.0.0"

dependencies:
  flutter:
    sdk: flutter

  # UI & Navigation
  cupertino_icons: ^1.0.6
  go_router: ^12.1.3
  flutter_screenutil: ^5.9.0

  # Video & Camera
  camera: ^0.10.5+5
  video_player: ^2.7.2
  path_provider: ^2.1.1
  path: ^1.8.3

  # MediaPipe & ML
  google_ml_kit: ^0.15.0
  tflite_flutter: ^0.10.4
  tflite_flutter_helper: ^0.3.1

  # Firebase
  firebase_core: ^2.17.0
  firebase_auth: ^4.10.1
  cloud_firestore: ^4.9.3
  firebase_storage: ^11.2.8
  firebase_analytics: ^10.5.1

  # State Management
  provider: ^6.0.5
  riverpod: ^2.4.6
  flutter_riverpod: ^2.4.6

  # HTTP & API
  http: ^1.1.0
  dio: ^5.3.2
  json_annotation: ^4.8.1

  # Utilities
  uuid: ^4.1.0
  intl: ^0.18.1
  shared_preferences: ^2.2.2
  permission_handler: ^11.0.1
  
  # Animations & UI Enhancements
  lottie: ^2.7.0
  shimmer: ^3.0.0
  flutter_staggered_animations: ^1.1.1

dev_dependencies:
  flutter_test:
    sdk: flutter

  # Code Generation
  build_runner: ^2.4.7
  json_serializable: ^6.7.1

  # Linting & Analysis
  flutter_lints: ^3.0.1
  very_good_analysis: ^5.1.0

  # Testing
  mockito: ^5.4.2
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/images/
    - assets/animations/
    - assets/models/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Regular.ttf
        - asset: assets/fonts/Poppins-Medium.ttf
          weight: 500
        - asset: assets/fonts/Poppins-SemiBold.ttf
          weight: 600
        - asset: assets/fonts/Poppins-Bold.ttf
          weight: 700